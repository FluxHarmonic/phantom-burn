<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Phantom Burn</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #0D0A1A; }
    body { display: flex; align-items: center; justify-content: center; }
    h1 { position: relative; margin: 0; padding: 0 4vw; font: italic 900 clamp(40px, 11vw, 132px)/1 ui-monospace, "DejaVu Sans Mono", monospace;
         letter-spacing: 0.06em; transform: skewX(-12deg);
         background: linear-gradient(#4DF2D9 0%, #4DF2D9 30%, #DBE0E6 70%, #F0F0FA 100%);
         -webkit-background-clip: text; background-clip: text; color: transparent; }
    /* the burn: a magenta stroke through the letters' top third */
    h1::after { content: ""; position: absolute; left: 0; right: 0; top: 30%; height: 0.07em;
                background: #FF59D9; box-shadow: 0 0 0.25em #FF59D9; mix-blend-mode: screen; }
  </style>
</head>
<body>
  <h1>PHANTOM BURN</h1>
</body>
</html>
